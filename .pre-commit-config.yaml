files: .

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-merge-conflict
    -   id: end-of-file-fixer
        exclude: ".*\\.drawio$"
    -   id: trailing-whitespace
        exclude: ".*\\.drawio$"
    -   id: detect-private-key
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
